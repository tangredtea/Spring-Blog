<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <th:block th:fragment="common-js">
        <script src="/js/jquery.min.js" ></script>
        <script src="/js/foreBlog.js" type="text/javascript" ></script>
        <script src="/js/category.js"></script>
        <script>
            /* 在页面渲染前注入预加载遮罩 */
            document.addEventListener('DOMContentLoaded', function(){
                var p = document.createElement('div');
                p.id = 'page-preloader';
                p.innerHTML = '<div class="spinner"></div>';
                document.body.insertBefore(p, document.body.firstChild);
            });
        </script>
        <link rel="stylesheet" href="/css/semantic.min.css">
        <link rel="stylesheet" href="/css/typo.css">
        <link rel="stylesheet" type="text/css" href="/css/foreBlog.css"/>
        <link rel="icon" href="/images/favicon.ico" th:href="#{web_Ico}" type="image/x-icon"/>
    </th:block>

</head>
<body>
<div id="navMenu" class="ui inverted segment navDiv-active "  th:fragment="menu">
    <div class="ui  container">
        <div class="ui stackable inverted secondary menu">
            <img class="ui rounded image logo" th:src="#{web_Logo}" alt="logo">
            <a href="/" class="item mobileHidden navItem"><i class="home icon"></i>首页</a>
            <a href="/types" class="item mobileHidden navItem"><i class="list icon"></i>分类</a>
            <a href="/tags" class="item mobileHidden navItem"><i class="ui tag icon"></i>标签</a>
            <a href="/time" class="item mobileHidden navItem"><i class="youtube icon"></i>归档</a>
            <a href="/message" class="item mobileHidden navItem"><i class="comments outline icon"></i>留言墙</a>
            <a href="/about" class="item mobileHidden navItem"><i class="ui street view icon"></i>关于我</a>
            <a href="/friends" class="item mobileHidden navItem"><i class="ui linkify icon"></i>友链</a>
            <div id="searchItem " class=" right menu item mobileHidden navItem">
                <div class="ui icon search input"   >
                    <form name="search" action="#" method="get" th:action="@{/search}"  >
                        <div class="ui icon search input" style="position: relative;">
                            <input class="prompt" id="searchInput" type="text" name="query" placeholder="AI 智能搜索..." th:value="${query}" autocomplete="off">
                            <i onclick="document.forms['search'].submit()" style="color: #d2691e" class="search link icon"></i>
                            <div id="searchSuggestions" style="display:none; position:absolute; top:100%; left:0; right:0; z-index:999; background:#fff; border:1px solid #ddd; border-radius:0 0 4px 4px; box-shadow:0 2px 8px rgba(0,0,0,0.15); max-height:200px; overflow-y:auto;">
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <span class="mobileShow mobileTitle" th:text="#{web_Name}"></span>
        <a class="ui black button mobileButton  mobileShow"><i class="sidebar icon"></i></a>
    </div>
</div>
</body>
</html>
