<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      lang="en">
<head>
    <!-- Standard Meta 适配移动设备 -->
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title th:text="'搜索结果 | '+ #{web_Name}"></title>
    <meta name="keywords" th:content="#{web_Keywords}">
    <meta name="description" th:content="#{web_Description}">
    <div th:replace="/fragments/header :: common-js"></div>
</head>

<body>

<div id="workingArea">

    <div th:replace="/fragments/header :: menu">
    </div>
    <div id="fillBackground" class="" >
    </div>

    <div class="pageHeadContainer">
        <img th:src="#{search_Background}" class="ui image backgroundImg">
        <div class="backgroundLayout">
            <div class="myInfoDiv" align="center">
                <div>
                    <span class="name" th:text="#{web_Name}"></span>
                </div>
                <div class="word" >
                    想见即所得
                </div>
            </div>
        </div>
    </div>
    <div class="search-results-wrap">
        <div class="search-results-container">
            <!--header-->
            <div class="search-results-header">
                <h3 class="search-results-title">搜索结果</h3>
                <span class="search-results-count">共 <strong th:text="${pageInfo.total}">0</strong> 篇文章</span>
            </div>

            <!-- 无结果提示 -->
            <div class="search-empty" th:if="${pageInfo.total == 0}">
                <i class="search icon" style="font-size:3em;color:#ccc;"></i>
                <p>没有找到相关文章，换个关键词试试吧</p>
            </div>

            <!-- 文章列表 -->
            <div class="search-result-item" th:each="blog : ${pageInfo.list}">
                <div class="search-result-content">
                    <h3><a th:href="@{/blog/{id}(id=${blog.id})}" th:text="${blog.title}">文章标题</a></h3>
                    <p class="search-result-desc" th:text="${blog.description}">文章描述</p>
                    <div class="search-result-meta">
                        <img th:src="@{${blog.user.avatar}}" alt="" class="ui avatar image">
                        <span th:text="${blog.user.nickname}">作者</span>
                        <span class="search-result-dot"></span>
                        <span th:text="${#dates.format(blog.updateTime, 'yyyy-MM-dd')}">日期</span>
                        <span class="search-result-dot"></span>
                        <i class="eye icon"></i><span th:text="${blog.views}">0</span>
                        <span class="search-result-tag">
                            <a th:text="${blog.type.name}" class="ui teal basic label m-padded-tiny m-text-thin">分类</a>
                        </span>
                    </div>
                </div>
                <a class="search-result-img" th:href="@{/blog/{id}(id=${blog.id})}">
                    <img th:src="@{${blog.firstPicture}}" alt="" class="ui rounded image">
                </a>
            </div>

            <!--分页-->
            <div class="search-pagination" th:if="${pageInfo.total > 0}">
                <a class="search-page-btn" th:href="${pageInfo.hasPreviousPage} ? @{/search(query=${query},pageNum=${pageInfo.prePage})} : @{/search(query=${query},pageNum=1)}">&laquo; 上一页</a>
                <span class="search-page-info">第 <span th:text="${pageInfo.pageNum}">1</span> / <span th:text="${pageInfo.pages}">1</span> 页</span>
                <a class="search-page-btn" th:href="${pageInfo.hasNextPage} ? @{/search(query=${query},pageNum=${pageInfo.nextPage})} : @{/search(query=${query},pageNum=${pageInfo.pages})}">下一页 &raquo;</a>
            </div>
        </div>
    </div>
    <button id="toTop" class="circular ui icon button" style="display: none;">
        <i class="ui caret up icon"></i>
    </button>
</div>
<div th:replace="/fragments/footer :: footer-content"></div>

</body>
</html>
